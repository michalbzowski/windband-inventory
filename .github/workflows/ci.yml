name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Full gate: checkstyle (validate) + unit tests + Testcontainers ITs
      # (failsafe, *IT) + SpotBugs (verify). Docker is preinstalled on the
      # runner, so Testcontainers works out of the box.
      - name: ./mvnw clean verify
        run: ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: npm run ci
        working-directory: frontend
        run: npm run ci
